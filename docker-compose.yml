services:
  nginx:
    image: nginx:alpine
    ports:
      - "8003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - mcp
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/politiscale
    restart: unless-stopped

  mcp:
    build: ./backend
    expose:
      - "8000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/politiscale
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    command: ["python", "mcp_server.py", "sse"]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
