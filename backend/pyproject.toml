[project]
name = "politiscale-backend"
version = "0.1.0"
description = "PolitiScale POC — Agrégation de données politiques françaises"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pandas>=2.2",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
